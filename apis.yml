name: Onefinestay
description: >-
  Onefinestay is a British luxury hospitality company founded in 2009 that curates
  and manages a portfolio of upmarket private homes, villas, apartments and chalets
  for short-term and extended vacation rentals, pairing hand-picked properties with
  hotel-grade concierge service. AccorHotels acquired Onefinestay in 2016 for around
  $168 million; in 2025 Exclusive Resorts took a controlling operational stake while
  Accor retained a majority interest. Onefinestay operates as a consumer travel brand
  with a booking website and a technical/engineering organization on GitHub, but it
  publishes no public developer API, OpenAPI specification, SDK program, or developer
  portal. This profile is maintained as a network company record.
